# Production stack for Sitecraft on the shared EC2 host.
# Lives at /opt/apps/sitecraft/docker-compose.yml (copied by .github/workflows/deploy.yml)
# next to /opt/apps/sitecraft/.env (see deploy/.env.example). Host Nginx terminates TLS:
#   https://sitecraft.13.203.3.1.sslip.io      -> 127.0.0.1:3001 (frontend)
#   https://api.sitecraft.13.203.3.1.sslip.io  -> 127.0.0.1:4001 (backend, routes under /api)
name: sitecraft

services:
  backend:
    image: ghcr.io/amitavrchy/sitecraft-backend:${IMAGE_TAG:-latest}
    container_name: sitecraft-backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "4000"
    ports:
      - "127.0.0.1:4001:4000"
    networks: [apps-net]
    deploy:
      resources:
        limits:
          memory: 400M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ghcr.io/amitavrchy/sitecraft-frontend:${IMAGE_TAG:-latest}
    container_name: sitecraft-frontend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3001:3000"
    networks: [apps-net]
    depends_on: [backend]
    deploy:
      resources:
        limits:
          memory: 320M
    logging: *logging

networks:
  apps-net:
    external: true
